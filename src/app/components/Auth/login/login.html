<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header class="header">
      <mat-card-title >Login</mat-card-title>
<!--    <a (click)="goToRegister()" class="link-button">Don't have an account?</a>
 -->
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
  <div class="form-group mb-3">
    <label for="email">Email address</label>
    <input
      type="email"
      id="email"
      class="form-control"
      formControlName="email"
      placeholder="Enter email"
      [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
    >
    <div>
 <!-- <small class="form-text text-muted">
      We'll never share your email with anyone else.
    </small> -->
    </div>
   

    <mat-error *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
      Email is <strong>required</strong>
    </mat-error>
    <mat-error *ngIf="loginForm.get('email')?.hasError('email') && !loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
      Please enter a valid email address
    </mat-error>
  </div>

  <!-- Password -->
  <div class="form-group mb-3">
    <label for="password">Password</label>
    <div class="input-group">
      <input
        [type]="hidePassword ? 'password' : 'text'"
        id="password"
        class="form-control"
        formControlName="password"
        placeholder="Password"
        [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
      >
      <button
        type="button"
        class="btn btn-outline-secondary "
        (click)="hidePassword = !hidePassword"
        tabindex="-1"
      >
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </div>

    <mat-error *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
      Password is <strong>required</strong>
    </mat-error>
    <mat-error *ngIf="loginForm.get('password')?.hasError('minlength') && loginForm.get('password')?.touched">
      Password must be at least 6 characters
    </mat-error>
  </div>

      <div class="form-group mb-3 mt-5">
          <button 
      [disabled]="loginForm.invalid"
          type="submit" 
          class=" btn saveBtn"
          >
            Login
          </button>
        </div>
      </form>
      
       <div class="signup-link">
        <p>Forget Password ?</p>
      </div> 
    </mat-card-content>
  </mat-card>
</div>
