<div class="container-fluid py-4">
  <!-- Header Section -->
     <app-management-toolbar
  title="CLASS_MANAGEMENT.TITLE"
  icon="groups"
  addButtonText="CLASS_MANAGEMENT.ADD_CLASS"
  (add)="openAddClassDialog()"
  (exportPdf)="exportPDF()"
  (exportExcel)="exportExcel()">
</app-management-toolbar>


 <div class="row mb-4 mt-4 d-flex justify-content-between align-items-center">
    <div class="col-md-5 col-lg-5 col-xs-12 ">
<app-management-search-filter
  placeholder="{{ 'CLASS_MANAGEMENT.CLASS_NAME' | translate }}"
  icon="class"
  (search)="applyFilter($event)">
</app-management-search-filter>
    </div>
     <div class="col-md-5 col-lg-5 col-xs-12 ">
<app-management-search-filter
  placeholder="{{ 'CLASS_MANAGEMENT.TEACHER' | translate }}"
  icon="person"
  (search)="applyFilter($event)">
</app-management-search-filter>
    </div>
  </div>
 
  <!-- Table Card -->
  <div class="card shadow-sm border-0 rounded-4 overflow-hidden management-card">
    <div class="card-body p-0">
      <app-management-data-table
  [dataSource]="dataSource"
  [columns]="columns"
  [displayedColumns]="displayedColumns"
  (edit)="openAddClassDialog($event)"
  (delete)="deleteClass($event)">
</app-management-data-table>
