<div class="container-fluid py-4">
  <!-- Header Section -->
     <app-management-toolbar
  title="SUBJECT_MANAGEMENT.TITLE"
  icon="menu_book"
  addButtonText="SUBJECT_MANAGEMENT.ADD_SUBJECT"
  (add)="openAddSubjectDialog()"
  (exportPdf)="exportPDF()"
  (exportExcel)="exportExcel()">
</app-management-toolbar>


  <!-- Filters -->
  <div class="row mb-4 mt-4 d-flex justify-content-between align-items-center">
    <div class="col-md-5 col-lg-5 col-xs-12 ">
      <app-management-search-filter
  placeholder="{{ 'SUBJECT_MANAGEMENT.NAME_LABEL' | translate }}"
  icon="subject"
  (search)="applyFilter($event)">
</app-management-search-filter>
    
    </div>
  </div>

  <!-- Table Card -->
  <div class="card shadow-sm border-0 rounded-4 overflow-hidden management-card">
    <div class="card-body p-0">
      <app-management-data-table
  [dataSource]="dataSource"
  [columns]="columns"
  [displayedColumns]="displayedColumns"
  (edit)="openAddSubjectDialog($event)"
  (delete)="deleteSubject($event)">
</app-management-data-table>
