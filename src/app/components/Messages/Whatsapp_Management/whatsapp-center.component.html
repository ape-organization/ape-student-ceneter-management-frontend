<div class="sms-center-container whatsapp-theme">
  <div>
   <h2 class="h3 fw-bold mb-1 text-gradient " >
    <mat-icon class="align-middle me-1" >message</mat-icon>

  </h2>

    <p class="subtitle">Send instant bulk WhatsApp notifications to students and parents.</p>
  </div>

      [templates]="templates"
      (sendMessageEvent)="sendMessage($event)">
    </app-management-sms-compose>
     <app-management-sms-summary
      [recipientCount]="currentRecipientCount"
      [totalSMS]="currentRecipientCount">
    </app-management-sms-summary>
