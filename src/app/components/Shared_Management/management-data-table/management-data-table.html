<div class="table-responsive">

 <table mat-table [dataSource]="dataSource" matSort class="w-100">

    @for (column of columns; track column.columnDef) {

      <ng-container [matColumnDef]="column.columnDef">

        
            <th mat-header-cell *matHeaderCellDef mat-sort-header
               class="text-uppercase small py-3 px-4">
          {{ column.header | translate }}
        </th>

       
<td mat-cell *matCellDef="let element" class="px-4 py-3">
          @if (column.columnDef === 'actions') {

            <button mat-icon-button color="primary" 
                    class="action-btn shadow-none"
                    (click)="edit.emit(element)">
               <mat-icon class="fs-5">edit</mat-icon>
            </button>

            <button mat-icon-button
            color="warn" class="action-btn shadow-none"
                    (click)="delete.emit(element)">
             <mat-icon class="fs-5">delete</mat-icon>
            </button>

          } @else {

            {{ column.cell(element) }}

          }

        </td>

      </ng-container>

    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="student-row"></tr>

  </table>

</div>


 <!-- Paginator -->
      <div class="px-3 py-2 border-top card-footer-bg">
        <mat-paginator  
        [pageSize]="10"
        showFirstLastButtons class="paginator-style bg-transparent " ></mat-paginator>
      </div>
